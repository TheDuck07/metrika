name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrika-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.0
          name: "Metrika v2.0 - APK Android Oficial con Logo Transparente"
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ### 📱 Metrika v2.0 - Release Oficial Android

            APK Android generado automáticamente con la versión 2.0 y el logo oficial transparente de Metrika:

            - 🏷️ **Logo Oficial Transparente en la APK Android**: Iconos launcher adaptativos y redondos (`ic_launcher`, `ic_launcher_round`, `ic_launcher_foreground`) con fondo transparente y diseño limpio.
            - 🔐 **Inicio con Google Real y Limpio**: Conexión con tu cuenta de Google sin simulaciones ni errores de autorización.
            - 👤 **Sistema de Cuentas y Perfil**: Cierre de sesión, gestión de nombre de tienda, foto de perfil personalizada y selector de tema Claro / Oscuro.
            - 🌸 **Reconocimiento Visual Offline**: Identificación inteligente de productos (ramos de flores, abarrotes, bebidas) mediante análisis de píxeles sin conexión.
            - 🎙️ **Dictado por Voz Offline**: Compatible con el micrófono integrado de Android (Gboard) y procesador NLP local sin conexión.
            - 📊 **Exportador Excel Funcional**: Descarga directa de reportes de ventas y balance a formatos CSV y hojas de cálculo.
            - 👵 **Accesibilidad para Adultos Mayores**: Botones de gran tamaño, contraste visual optimizado y tipografía clara.
            - 🔑 **Inicio con Google Real**: Compatibilidad con Google Identity Services (GIS), inicio con tu propio correo `@gmail.com` y funcionamiento continuo en modo offline.
            - 📊 **Exportador Excel Funcional**: Descarga directa de reportes de ventas y balance a formatos CSV con BOM UTF-8 y hoja de cálculo `.xls`, además de copiado al portapapeles en 1 toque.
            - 📸 **Inventario con Cámara IA y Modo Manual**: Agregado de productos por fotografía de etiquetas con IA, dictado por voz o ingreso manual.
            - 👵 **Accesibilidad para Adultos Mayores**: Botones de gran tamaño, contraste visual optimizado y tipografía clara.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
