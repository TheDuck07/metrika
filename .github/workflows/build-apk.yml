name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrika-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.5.0
          name: "Metrika v1.5.0 - Logo Oficial, Pantalla de Ingreso y Cuentas"
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ### 📱 Metrika v1.5.0 - Nueva Identidad de Marca y Cuentas

            APK Android generado automáticamente con el logo oficial de Metrika y todas las mejoras solicitadas:

            - 🏷️ **Logo Oficial en la APK Android**: Iconos launcher adaptativos y redondos (`ic_launcher`, `ic_launcher_round`, `ic_launcher_foreground`) con el isotipo oficial de Metrika en todas las densidades (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi).
            - 🔐 **Pantalla de Inicio de Sesión Oficial**: Rediseño exacto del Mockup Pantalla 1 con cabecera azul `#1E70BA`, isotipo "M", destellos, onda de transición verde lima `#9EC84A`, botones redondeados "Iniciar sesión", "Crear cuenta", Google y Modo Demo.
            - 👤 **Sistema de Cuentas y Perfil**: Cierre de sesión, personalización de nombre de tienda y comerciante, foto de perfil desde cámara o galería y selector de tema Claro / Oscuro.
            - 🔑 **Inicio con Google Real**: Compatibilidad con Google Identity Services (GIS), inicio con tu propio correo `@gmail.com` y funcionamiento continuo en modo offline.
            - 📊 **Exportador Excel Funcional**: Descarga directa de reportes de ventas y balance a formatos CSV con BOM UTF-8 y hoja de cálculo `.xls`, además de copiado al portapapeles en 1 toque.
            - 📸 **Inventario con Cámara IA y Modo Manual**: Agregado de productos por fotografía de etiquetas con IA, dictado por voz o ingreso manual.
            - 👵 **Accesibilidad para Adultos Mayores**: Botones de gran tamaño, contraste visual optimizado y tipografía clara.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
