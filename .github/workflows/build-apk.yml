name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrika-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.5.0
          name: "Metrika v1.5.0 - Nueva Interfaz & Control de Inventario con Cámara"
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ### 📱 Metrika v1.5.0 - Nueva Imagen de Marca y Control Total
            APK Android actualizado con la nueva identidad de marca y todas las optimizaciones:
            
            - 🎨 **Nueva Identidad Visual**: Interfaz rediseñada con los colores oficiales de la marca Metrika (`#1E70BA`, `#9EC84A`, `#EE6B4D`).
            - 📸 **Inventario con Cámara y Modo Manual**: Accesos directos de 1 toque para agregar productos fotografiándolos con IA o mediante formulario manual con dictado por voz.
            - 📊 **Datos y Métricas 100% Reales en Bs.**: Gráficas de evolución semanal/mensual y balances sincronizados en tiempo real con las ventas del negocio.
            - 👵 **Diseño Accesible**: Botones grandes de alto contraste pensados para uso rápido en mostrador.
            - 📦 **APK Android Listo**: Compilado para instalación directa en cualquier teléfono Android.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
