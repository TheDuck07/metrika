name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrika-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Metrika v1.0.${{ github.run_number }} (APK Actualizado)"
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ### 📱 Metrika v1.0.${{ github.run_number }} - Hola al control total
            APK Android actualizado con todos los recursos locales incluidos:
            
            - **Íconos Locales 100% Offline**: No requiere internet para cargar fuentes ni gráficos.
            - **Cámara & Audio Sin Tokens**: Reconocimiento de voz y fotos de productos local en el teléfono.
            - **Gráficas y Reportes Adaptados**: Soporte completo de modo oscuro y diseño responsive en cualquier móvil.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
